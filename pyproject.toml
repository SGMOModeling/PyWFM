[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "iwfm-pywfm"
authors = [{name = "Tyler Hatch", email = "hatch.tyler@gmail.com"}]
description = "python library to interact with Integrated Water Flow Model (IWFM) applications"
readme = "README.md"
requires-python = ">=3.10"
# dependencies are set in setup.py: platform wheels add the Intel runtime
# packages their bundled library needs
dynamic = ["version", "dependencies"]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-xdist",
]

[project.urls]
Documentation = "https://sgmomodeling.github.io/PyWFM"
Repository = "https://github.com/SGMOModeling/PyWFM"
Issues = "https://github.com/SGMOModeling/PyWFM/issues"

[tool.setuptools]
include-package-data = true

# Platform wheels bundle the IWFM library in pywfm/_lib (copied there by the
# wheel build; see setup.py). Source distributions and plain installs do not.
[tool.setuptools.package-data]
pywfm = ["_lib/*.dll", "_lib/*.so", "_lib/LICENSE*", "_lib/*.txt"]

[tool.setuptools.dynamic]
version = {attr = "pywfm.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "unit: tests that don't need a DLL or model fixture",
    "integration: requires the SampleModel and a loaded DLL",
    "regression: pinned golden values (subset of integration)",
    "simulation: runs an IWFM simulation; slower than inquiry-only tests",
    "slow: requires C2VSimCG; skipped by default unless --runslow is passed",
]

[project.scripts]
pywfm = "pywfm.cli:cli"